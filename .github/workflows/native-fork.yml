# Builds the native addon plus its bundled GPL ffmpeg for macOS (arm64) and Linux (x64),
# smoke-tests them, and publishes the platform packages as a GitHub Release.
# Nothing here is committed to git: the binaries are too big (the macOS .node alone is ~160MB,
# over GitHub's 100MB file cap). The release holds per-platform tarballs that mcms installs
# over the stock @kinetographdev packages with npm overrides.
#
# Run from the Actions tab (workflow_dispatch) on main. Needs no secrets: GITHUB_TOKEN is enough
# for a release in this repo. mnusrhimjy run needs a version: a platform package tarball
# always carries the version inside package.json, and npm refuses to install an override
# whose version does not satisfy the dist branch's dependency range
# (currently `@kinetographdev/native(-<platform>): 0.3.0`).
#
# After the run: download both tarballs from the release, host them where prod can fetch them,
# and point mcms's overrides at the URLs.
name: native-fork

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Native version to stamp (must satisfy the dist branches, e.g. 0.3.0)'
        required: true
        type: string
        default: '0.3.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FFMPEG_CACHE_VERSION: v4

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config nasm make git cmake

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf cmake

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_CACHE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg (LGPL, linked into the addon)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      - name: Cache the GPL ffmpeg
        id: ffmpeg-gpl-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-gpl
          key: ffmpeg-gpl-${{ env.FFMPEG_CACHE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg-gpl.sh') }}

      - name: Build the GPL ffmpeg (bin/ffmpeg)
        if: steps.ffmpeg-gpl-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg-gpl.sh "$RUNNER_TEMP/ffmpeg-gpl"

      - run: npm ci

      - name: Stamp the fork native version
        run: |
          v='${{ inputs.version }}'
          node -e "
            const fs = require('node:fs');
            for (const f of ['crates/node/package.json', 'crates/node/npm/darwin-arm64/package.json', 'crates/node/npm/linux-x64-gnu/package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = '$v';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
          "
          grep '"version"' crates/node/package.json crates/node/npm/*/package.json

      - name: Build the addon
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: npm run build:release -w @kinetographdev/native -- --target ${{ matrix.target }} --features ffmpeg-static

      - name: Verify the fix is in the binary
        shell: bash
        run: |
          f=crates/node/kinetograph.${{ matrix.platform }}.node
          ls -l "$f"
          d=crates/node/npm/${{ matrix.platform }}/bin
          mkdir -p "$d"
          cp "$RUNNER_TEMP"/ffmpeg-gpl/bin/ffmpeg "$d/ffmpeg"
          cp "$RUNNER_TEMP/ffmpeg-gpl/SOURCES.txt" "$d/SOURCES.txt"
          "$d"/ffmpeg -hide_banner -h filter=setparams | head -3
          "$d"/ffmpeg -hide_banner -h filter=setparams | grep -q 'colorspace' \
            || { echo 'setparams filter missing from bundled ffmpeg'; exit 1; }

      - name: Test the tracker
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: cargo test --release --target ${{ matrix.target }} -p libmv-sys -p kinetograph-track --features kinetograph-track/ffmpeg-static -- --nocapture

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.platform }}
          path: |
            crates/node/kinetograph.${{ matrix.platform }}.node
            crates/node/npm/${{ matrix.platform }}/bin
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-22.04
            platform: linux-x64-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install a Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true

      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.platform }}
          path: crates/node

      - name: Make bin/ffmpeg executable
        run: chmod +x crates/node/npm/${{ matrix.platform }}/bin/ffmpeg

      - run: npm ci

      - name: Build the TypeScript packages
        shell: bash
        run: |
          for p in scene compat react core audio cli; do npm run build -w "packages/$p"; done
          npm run build -w @kinetographdev/studio-ui
          npm run build -w @kinetographdev/studio

      - name: Clean install and render
        run: node scripts/smoke/clean-install.mjs

  release:
    name: publish release tarballs
    needs: smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp the fork native version
        run: |
          v='${{ inputs.version }}'
          node -e "
            const fs = require('node:fs');
            for (const f of ['crates/node/package.json', 'crates/node/npm/darwin-arm64/package.json', 'crates/node/npm/linux-x64-gnu/package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = '$v';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
          "

      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: crates/node/artifacts

      - name: Assemble the platform packages
        working-directory: crates/node
        run: |
          npx napi artifacts --output-dir artifacts
          for p in darwin-arm64 linux-x64-gnu; do
            a=artifacts/bindings-$p/npm/$p/bin
            mkdir -p "npm/$p/bin"
            cp "$a/ffmpeg" "$a/SOURCES.txt" "npm/$p/bin/"
          done
          chmod +x npm/darwin-arm64/bin/ffmpeg npm/linux-x64-gnu/bin/ffmpeg
          npm run legal
          for d in npm/darwin-arm64 npm/linux-x64-gnu; do ls -l "$d"; done

      - name: Check the package contents
        run: |
          node scripts/check-packages.mjs
          for d in crates/node/npm/darwin-arm64 crates/node/npm/linux-x64-gnu; do test -f "$d"/kinetograph.*.node; done
          for d in crates/node/npm/darwin-arm64 crates/node/npm/linux-x64-gnu; do ls "$d"/bin/ffmpeg "$d"/bin/SOURCES.txt "$d"/FFMPEG-LICENSE.md "$d"/COPYING.GPLv2; done
          test -x crates/node/npm/linux-x64-gnu/bin/ffmpeg
          du -sh crates/node/npm/*/bin

      # mcms installs them with npm overrides keyed on the stock names, e.g.:
      #   "@kinetographdev/native-darwin-arm64": "$kinetographdev__native-darwin-arm64",
      #   "kinetographdev__native-darwin-arm64": "https://…/kinetographdev-native-darwin-arm64-<version>.tgz",
      # The base `@kinetographdev/native` stays npm 0.3.0: `optionalDependencies` resolves
      # the platform packages at install time, and the checked-in loader picks them up.
      - name: Pack the platform tarballs
        working-directory: crates/node
        run: |
          for d in npm/darwin-arm64 npm/linux-x64-gnu; do (cd "$d" && npm pack); done
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          mv npm/*/*.tgz "$GITHUB_WORKSPACE/tarballs/"
          ls -l "$GITHUB_WORKSPACE/tarballs"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v${{ inputs.version }}
          name: native v${{ inputs.version }}
          body: |
            Fork native build: addon + bundled ffmpeg (with the `setparams` colour-tag fix)
            for macOS arm64 and Linux x64. Install the tarballs below via npm overrides in mcms.
          files: tarballs/*
